<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Portal de Desarrolladores - Core Bancario API</title>
    <link rel="stylesheet" href="https://unpkg.com">
</head>
<body>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com"></script>
    <script>
        window.onload = () => {
            window.ui = SwaggerUIBundle({
                url: './api-core/openapi.json', // Apunta directo a tu contrato de gran escala
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [SwaggerUIBundle.presets.apis]
            });
        };
    </script>
</body>
</html>
